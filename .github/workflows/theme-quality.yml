name: Theme Quality

on:
  push:
    paths:
      - '**.php'
      - '**.js'
      - '**.mjs'
      - 'dev/composer.json'
      - 'dev/package.json'
      - 'dev/phpcs.xml.dist'
      - 'dev/phpstan.neon.dist'
      - 'dev/phpstan-baseline.neon'
      - '.github/workflows/theme-quality.yml'
  pull_request:
    paths:
      - '**.php'
      - '**.js'
      - '**.mjs'
      - 'dev/composer.json'
      - 'dev/package.json'
      - 'dev/phpcs.xml.dist'
      - 'dev/phpstan.neon.dist'
      - 'dev/phpstan-baseline.neon'
      - '.github/workflows/theme-quality.yml'

jobs:
  sanity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Composer metadata
        run: composer validate --strict
        working-directory: dev

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: dev

      - name: Run PHP syntax lint
        run: composer run lint:php:syntax
        working-directory: dev

      - name: Run JavaScript syntax check
        run: npm run check:js
        working-directory: dev

      - name: Run smoke regression tests
        run: npm run test:smoke
        working-directory: dev

  static-analysis:
    runs-on: ubuntu-latest
    needs: sanity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: dev

      - name: Run PHPCS
        run: composer run lint:php
        working-directory: dev

      - name: Run PHPStan
        run: composer run analyse:php
        working-directory: dev
